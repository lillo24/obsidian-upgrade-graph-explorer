<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const key = 'icarus.graph-explorer.appearance.v1';
        let preference = 'system';
        try {
          const raw = localStorage.getItem(key);
          if (raw !== null) {
            const stored = JSON.parse(raw);
            if (
              stored !== null &&
              typeof stored === 'object' &&
              !Array.isArray(stored) &&
              Object.keys(stored).sort().join(',') === 'preference,version' &&
              stored.version === 1 &&
              (stored.preference === 'system' ||
                stored.preference === 'light' ||
                stored.preference === 'dark')
            ) {
              preference = stored.preference;
            }
          }
        } catch {
          // The runtime will surface storage/validation failures after mount.
        }
        const resolved =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Local structural graph explorer for validated Markdown workspace reports"
    />
    <meta name="theme-color" content="#101723" />
    <title>Icarus Graph Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
