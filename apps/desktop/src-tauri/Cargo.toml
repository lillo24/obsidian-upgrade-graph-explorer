[package]
name = "icarus-graph-explorer-desktop"
version = "0.0.0"
description = "Read-only desktop shell for Icarus Graph Explorer"
authors = ["Icarus Graph Explorer contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "icarus_graph_explorer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-fs = "=2.5.1"
